---
name: Renovate Auto-Publish

on:
  push:
    branches:
      - main
    paths:
      - "Makefile"

permissions:
  contents: read

jobs:
  verify:
    name: Verify TALOS_VERSION bump
    if: github.actor == 'contain-renovate[bot]'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.verify.outputs.proceed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Verify Makefile exclusivity and regex
        id: verify
        run: |
          # Only republish when the commit touches nothing but the pinned Talos
          # series, so an unrelated Makefile edit never ships an image.
          FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          COUNT=$(echo "$FILES" | wc -l)

          # -U0 so only added/changed lines are considered
          MATCH=$(git diff HEAD^ HEAD -U0 -- Makefile | grep "^\+" | grep -qE "TALOS_VERSION \?= .*" && echo "yes" || echo "no")

          if [ "$COUNT" -eq 1 ] && [ "$FILES" = "Makefile" ] && [ "$MATCH" = "yes" ]; then
            echo "Proceeding with publish: valid TALOS_VERSION bump detected."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Condition failed. Count: $COUNT, Files: $FILES, Match: $MATCH"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  vars:
    name: Resolve versions
    needs: verify
    if: needs.verify.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      talos_version: ${{ steps.vars.outputs.talos_version }}
      full_version: ${{ steps.vars.outputs.full_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve versions
        id: vars
        run: |
          # The app version stays at the last release tag; only the Talos
          # series moves, giving a new <app version>-<talos series> image tag.
          TALOS_VERSION=$(grep -E '^TALOS_VERSION \?=' Makefile | awk '{print $3}')
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          {
            echo "talos_version=$TALOS_VERSION"
            echo "version=$VERSION"
            echo "full_version=$VERSION-$TALOS_VERSION"
          } >> "$GITHUB_OUTPUT"

  # container-cd.yaml builds the image in a job without an OIDC token, then
  # signs SLSA build provenance and a cosign signature for its digest in a
  # separate job.
  image:
    name: Publish
    needs: vars
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: neticdk/shared-github-actions/.github/workflows/container-cd.yaml@714a9565dec5f76ff9d578c0fac0c8f9db5e77de # v1.2.0
    with:
      image: ghcr.io/containdk/talos-zpool-extension
      tags: |
        ${{ needs.vars.outputs.full_version }}
        latest
      build-args: |
        VERSION=${{ needs.vars.outputs.version }}
        TALOS_VERSION=${{ needs.vars.outputs.talos_version }}
      # container-cd adds source, url, revision, version and created; these
      # keep the remaining labels docker/metadata-action used to set.
      labels: |
        org.opencontainers.image.title=talos-zpool-extension
        org.opencontainers.image.description=A Talos extensions for creating a zpool at boot
        org.opencontainers.image.licenses=MIT
