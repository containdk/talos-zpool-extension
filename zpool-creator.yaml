name: zpool-creator
depends:
  - service: udevd
  - service: cri
  - path: /dev/zfs
  - service: ext-zfs-service
  - path: /usr/local/sbin/zpool
  - path: /usr/local/sbin/zfs
  - configuration: true
container:
  entrypoint: /create-zpool
  environment:
    - PATH=/usr/local/sbin
  mounts:
    - source: /usr/local/sbin/zpool
      destination: /usr/local/sbin/zpool
      type: bind
      options:
        - rbind
        - ro
    - source: /usr/local/sbin/zfs
      destination: /usr/local/sbin/zfs
      type: bind
      options:
        - rbind
        - ro
    - source: /usr/local/lib
      destination: /usr/local/lib
      type: bind
      options:
        - rbind
        - ro
    - source: /usr/lib
      destination: /usr/lib
      type: bind
      options:
        - rbind
        - ro
    - source: /lib
      destination: /lib
      type: bind
      options:
        - rbind
        - ro
    - source: /var/mnt
      destination: /var/mnt
      type: bind
      options:
        - rshared
        - rbind
        - rw
    - source: /dev
      destination: /dev
      type: bind
      options:
        - rshared
        - rbind
        - rw
  # The container root defaults to rprivate, which makes the rshared binds private as well.
  # Without this, the pools and datasets this service creates stay mounted only in its own
  # namespace, and the host sees them only after a reboot lets zfs-service import them.
  security:
    rootfsPropagation: shared
restart: untilSuccess
logToConsole: true
